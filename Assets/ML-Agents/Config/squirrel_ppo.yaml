behaviors:
  Squirrel:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 5.0e-3        # entropy coefficient — keeps exploration alive
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true     # normalizes observations — important for hunger/energy/fear ranges
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 10
    max_steps: 2_000_000
    time_horizon: 256
    summary_freq: 5000
    checkpoint_interval: 50000
